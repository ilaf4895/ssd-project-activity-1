<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Login | Smart University Transport</title><link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-body">
<header class="topbar"><a class="brand" href="index.html"><span class="brand-mark">SU</span><span>Smart University Transport</span></a><a class="back-link" href="index.html">← Home</a></header>
<main class="auth-shell">
  <section class="auth-card">
    <span class="eyebrow">Student Portal</span><h1>Welcome back</h1><p class="muted">Login as a Day Scholar or Hostelite student.</p>
    <div id="message" class="message hidden"></div>
    <form id="loginForm">
      <label>Email / Student ID<input id="identifier" required autocomplete="username" placeholder="e.g. bilal@university.edu"></label>
      <label>Password<div class="password-wrap"><input id="password" type="password" required autocomplete="current-password" placeholder="Enter password"><button type="button" class="eye" data-target="password">Show</button></div></label>
      <button class="btn primary full" type="submit">Login</button>
    </form>
    <p class="auth-switch">Don't have an account? <a href="signup.html">Create one</a></p>
  </section>
</main>
<script src="js/storage.js"></script><script src="js/auth.js"></script>
</body>
</html>
